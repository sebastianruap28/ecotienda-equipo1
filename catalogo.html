<!DOCTYPE html>
<!-- DOCTYPE: le dice al navegador que esta pagina es HTML5. Siempre va en la primera linea -->
<!-- html: encierra TODA la pagina. lang="es": el texto esta en espanol -->
<html lang="es">
<!-- head: datos de la pagina que NO se ven (titulo, estilos, fuentes y scripts) -->

<head>
    <!-- meta charset="UTF-8": permite tildes y enes -->
    <meta charset="UTF-8">
    <!-- meta viewport: en el celular, la pagina usa el ancho real de la pantalla, sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title: el texto de la pestana del navegador -->
    <title>Catálogo · EcoEnergetic</title>
    <!-- Bootstrap 5: hoja de estilos ya hecha, desde internet (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts: la fuente Rubik. preconnect abre la conexion antes, para que cargue mas rapido -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?
family=Rubik:wght@400;500;700&amp;display=swap">
    <!-- La hoja de estilos PROPIA (externa): la MISMA de las otras paginas, asi todas se ven iguales.
Va DESPUES de Bootstrap -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- script: carga el programa JavaScript js/tienda.js (el catalogo y el carrito).
defer: lo ejecuta cuando la pagina ya termino de cargar
(si no, JavaScript buscaria #productos antes de que exista) -->
    <script src="js/tienda.js" defer></script>
    <!-- Cierra el head -->
</head>
<!-- body: todo lo que se ve. container centra el contenido; py-3 deja espacio arriba y abajo -->

<body class="container py-3">
    <!-- header: el encabezado, igual al de las otras paginas -->
    <header class="encabezado">
        <!-- La marca de la tienda -->
        <span class="marca">EcoEnergetic</span>
        <!-- h1: el titulo principal de esta pagina -->
        <h1>Catálogo</h1>
        <!-- p: un parrafo que explica la pagina -->
        <p>Cada producto dice cuánto ahorra al mes, con una tarifa de 950 COP/kWh.</p>
        <!-- nav: el menu, con un enlace a cada una de las 4 paginas -->
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <!-- class="actual": esta es la pagina en la que se esta; sale resaltada -->
            <a href="catalogo.html" class="actual" aria-current="page">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <!-- Cierra el menu -->
        </nav>
        <!-- Cierra el encabezado -->
    </header>
    <!-- main: el contenido principal -->
    <main>
        <!-- div class="filtros": la caja con los botones de filtro y el buscador.
Flexbox los pone en una fila -->
        <div class="filtros">
            <!-- button: un BOTON. type="button": un boton normal (no envia formularios).
data-categoria: un dato PROPIO guardado en el boton; JavaScript lo lee
con boton.dataset.categoria para saber que categoria mostrar.
"filtro activo": este es el boton elegido al empezar (Todas) -->
            <button type="button" class="filtro activo" data-categoria="todas">Todas</button>
            <!-- Un boton por cada una de las 4 categorias.
El valor de data-categoria es igual al de la propiedad categoria de los productos -->
            <button type="button" class="filtro" data-categoria="iluminacion">Iluminación</button>

            <button type="button" class="filtro" data-categoria="climatizacion">Climatización</button>
            <button type="button" class="filtro" data-categoria="cocina">Cocina</button>
            <button type="button" class="filtro" data-categoria="solar">Energía solar</button>
            <!-- El BUSCADOR: una etiqueta y un campo de texto -->
            <div class="buscador">
                <!-- label: el nombre del campo. for="buscar": pertenece al campo con id="buscar" -->
                <label for="buscar">Buscar:</label>
                <!-- input type="search": un campo de texto para buscar.
id="buscar": JavaScript lo encuentra por este nombre y escucha su evento "input".
placeholder: el texto gris de ayuda que sale cuando esta vacio -->
                <input type="search" id="buscar" placeholder="Nombre del producto">
                <!-- Cierra el buscador -->
            </div>
            <!-- Cierra la caja de los filtros -->
        </div>
        <!-- div class="catalogo": dos columnas (Grid): los productos a la izquierda
y el carrito a la derecha. En tablet y celular, el carrito pasa debajo -->
        <div class="catalogo">
            <!-- div id="productos": esta VACIO a proposito. JavaScript (js/tienda.js) lo busca
con document.querySelector("#productos") y le escribe una tarjeta por producto
(y lo vuelve a llenar cada vez que se filtra o se busca).
class="tarjetas": la rejilla de 3, 2 o 1 columnas -->
            <div id="productos" class="tarjetas"></div>
            <!-- aside: contenido al lado del principal. Aqui, el CARRITO.
id="carrito": JavaScript y CSS lo encuentran por este nombre -->
            <aside id="carrito">
                <!-- h2: el titulo del carrito. El span id="cantidad" empieza en 0;
JavaScript escribe ahi cuantos productos hay -->
                <h2>Carrito (<span id="cantidad">0</span>)</h2>
                <!-- ul: una LISTA sin numeros. Empieza vacia; JavaScript le agrega
un li (elemento de la lista) por cada producto del carrito -->
                <ul id="lista-carrito"></ul>
                <!-- Dos parrafos vacios: JavaScript escribe aqui el total,
y el ahorro al mes con los meses en que se paga la compra -->
                <p id="total"></p>
                <p id="ahorro"></p>
                <!-- El boton para vaciar el carrito. Clases de Bootstrap:
btn = boton; btn-outline-secondary = gris, solo con borde; btn-sm = pequeno -->
                <button type="button" id="vaciar" class="btn btn-outline-secondary btn-sm">Vaciar

                    carrito</button>

                <!-- Cierra el carrito -->
            </aside>
            <!-- Cierra las dos columnas -->
        </div>
        <!-- Cierra el contenido principal -->
    </main>

    <!-- footer: el pie de pagina -->
    <footer class="pie">
        <!-- Aviso: los productos no son reales -->
        <p>Los productos y sus precios son de ejemplo.</p>
        <!-- El curso y la institucion -->
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
        <!-- Cierra el pie de pagina -->
    </footer>
    <!-- Cierra el cuerpo: aqui termina lo que se ve -->
</body>
<!-- Cierra la pagina -->

</html>
