<!DOCTYPE html>
<!-- DOCTYPE: le dice al navegador que esta pagina es HTML5. Siempre va en la primera linea -->
<!-- html: encierra TODA la pagina. lang="es": el texto esta en espanol -->
<html lang="es">
<!-- head: datos de la pagina que NO se ven (titulo, estilos, fuentes y scripts) -->
<head>
<!-- meta charset="UTF-8": permite tildes y enes -->
<meta charset="UTF-8">
<!-- meta viewport: en el celular, la pagina usa el ancho real de la pantalla, sin zoom -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- title: el texto de la pestana del navegador -->
<title>Contacto · EcoEnergetic</title>
<!-- Bootstrap 5: hoja de estilos ya hecha, desde internet (CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<!-- Google Fonts: la fuente Rubik. preconnect abre la conexion antes, para que cargue mas rapido -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?
family=Rubik:wght@400;500;700&amp;display=swap">
<!-- La hoja de estilos PROPIA (externa), la misma de todas las paginas. Va DESPUES de Bootstrap -->
<link rel="stylesheet" href="css/estilos.css">
<!-- script: carga el programa JavaScript js/contacto.js (el mensaje al enviar el formulario).
defer: lo ejecuta cuando la pagina ya termino de cargar -->
<script src="js/contacto.js" defer></script>
<!-- Cierra el head -->
</head>
<!-- body: todo lo que se ve. container centra el contenido; py-3 deja espacio arriba y abajo -->
<body class="container py-3">
<!-- header: el encabezado, igual al de las otras paginas -->
<header class="encabezado">
<!-- La marca de la tienda -->
<span class="marca">EcoEnergetic</span>
<!-- h1: el titulo principal de esta pagina -->
<h1>Contacto</h1>
<!-- p: un parrafo que explica la pagina -->
<p>Cuéntenos qué equipo quiere cambiar y le ayudamos a calcular el ahorro.</p>
<!-- nav: el menu, con un enlace a cada una de las 4 paginas -->
<nav class="menu">
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
<a href="nosotros.html">Nosotros</a>
<!-- class="actual": esta es la pagina en la que se esta; sale resaltada -->
<a href="contacto.html" class="actual" aria-current="page">Contacto</a>
<!-- Cierra el menu -->
</nav>
<!-- Cierra el encabezado -->
</header>
<!-- main: el contenido principal -->
<main>
<!-- h2: el subtitulo -->
<h2>Escríbanos</h2>
<!-- form: un FORMULARIO. Tiene 6 campos, cada uno con su label.
id="form-contacto": JavaScript lo encuentra por este nombre.
class="formulario": la caja blanca con sombra (clase propia) -->
<form id="form-contacto" class="formulario">
<!-- CAMPO 1: el nombre. div class="mb-3": clase de Bootstrap; deja un margen debajo -->
<div class="mb-3">
<!-- label: el nombre del campo. for="nombre": pertenece al campo con id="nombre"
(al hacer clic en el label, el cursor pasa al campo).
form-label: el estilo de Bootstrap para los labels -->
<label for="nombre" class="form-label">Nombre completo</label>
<!-- input type="text": un campo de texto de una linea.
name: el nombre con que se enviaria el dato.

form-control: el estilo de Bootstrap para los campos.
required: es obligatorio; el navegador no deja enviar si esta vacio -->
<input type="text" id="nombre" name="nombre" class="form-control" required>
</div>
<!-- CAMPO 2: el correo. type="email": el navegador revisa que tenga forma de correo -->
<div class="mb-3">
<label for="correo" class="form-label">Correo electrónico</label>
<input type="email" id="correo" name="correo" class="form-control" required>
</div>
<!-- CAMPO 3: el telefono. type="tel": en el celular abre el teclado de numeros -->
<div class="mb-3">
<label for="telefono" class="form-label">Teléfono</label>
<input type="tel" id="telefono" name="telefono" class="form-control">
</div>
<!-- CAMPO 4: la ciudad -->
<div class="mb-3">
<label for="ciudad" class="form-label">Ciudad</label>
<input type="text" id="ciudad" name="ciudad" class="form-control">
</div>
<!-- CAMPO 5: la categoria que le interesa -->
<div class="mb-3">
<label for="interes" class="form-label">Categoría que le interesa</label>
<!-- select: una lista desplegable. form-select: su estilo de Bootstrap -->
<select id="interes" name="interes" class="form-select">
<!-- option: cada opcion de la lista. value: el dato que se enviaria -->
<option value="iluminacion">Iluminación</option>
<option value="climatizacion">Climatización</option>
<option value="cocina">Cocina</option>
<option value="solar">Energía solar</option>
</select>
</div>
<!-- CAMPO 6: el mensaje -->
<div class="mb-3">
<label for="mensaje" class="form-label">Mensaje</label>
<!-- textarea: un campo de texto de varias lineas. rows="4": 4 lineas de alto -->
<textarea id="mensaje" name="mensaje" class="form-control" rows="4" required></textarea>
</div>
<!-- El boton de enviar. type="submit": envia el formulario (produce el evento "submit").
btn btn-primary: el boton principal de Bootstrap, con los colores de la tienda -->
<button type="submit" class="btn btn-primary">Enviar mensaje</button>
<!-- El parrafo de la respuesta: empieza vacio y oculto (d-none = no se muestra).
Al enviar, js/contacto.js le escribe el mensaje y le quita d-none.
alert alert-warning: el aviso de Bootstrap; mt-3 = margen arriba; mb-0 = sin margen abajo -->
<p id="respuesta" class="alert alert-warning mt-3 mb-0 d-none"></p>
<!-- Cierra el formulario -->
</form>
<!-- Cierra el contenido principal -->
</main>

<!-- footer: el pie de pagina -->
<footer class="pie">
<!-- Aviso: los productos no son reales -->
<p>Los productos y sus precios son de ejemplo.</p>
<!-- El curso y la institucion -->
<p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
<!-- Cierra el pie de pagina -->
</footer>
<!-- Cierra el cuerpo: aqui termina lo que se ve -->
</body>
<!-- Cierra la pagina -->
</html>
